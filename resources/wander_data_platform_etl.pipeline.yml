# The main pipeline for wander_data_platform

resources:
  pipelines:
    wander_data_platform_etl:
      name: wander_data_platform_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/wander_data_platform_etl"

      libraries:
        - glob:
            include: ../src/wander_data_platform_etl/**
