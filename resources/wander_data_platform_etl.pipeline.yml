# The main pipeline for wander_data_platform

resources:
  pipelines:
    wander_data_platform_etl:
      name: wander_data_platform_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/wander_data_platform_etl"

      libraries:
        - glob:
            include: ../src/wander_data_platform_etl/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
