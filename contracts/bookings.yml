dataset: bookings

primary_key:

  - booking_id

columns:

  booking_id:

    type: bigint

    nullable: false

  user_id:

    type: bigint

    nullable: false

  property_id:

    type: bigint

    nullable: false

  check_in:

    type: date

    nullable: false

  check_out:

    type: date

    nullable: false

  guests_count:

    type: int

    nullable: false

    constraints:

      - "guests_count > 0"

  total_amount:

    type: float

    nullable: false

    constraints:

      - "total_amount >= 0"

  status:

    type: string

    nullable: false

    allowed_values:

      - pending

      - confirmed

      - cancelled

      - completed

  created_at:

    type: date

    nullable: true

  updated_at:

    type: date

    nullable: true

relationships:

  - column: user_id

    references: users.user_id

  - column: property_id

    references: properties.property_id