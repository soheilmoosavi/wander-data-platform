# This is a Declarative Automation Bundle definition for wander_data_platform.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: wander_data_platform
  uuid: 6a725734-1fb0-40d0-a2d9-bc7b30c02d80

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6976a0a2-4687.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-6976a0a2-4687.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/soheilmoosavi@outlook.dk to make sure we only have a single copy.
      root_path: /Workspace/Users/soheilmoosavi@outlook.dk/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: soheilmoosavi@outlook.dk
        level: CAN_MANAGE
